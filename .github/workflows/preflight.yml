name: Hosted runner feasibility probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test project and workflow contracts
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Report runner space and tools
        run: python scripts/ci/runner_probe.py --report-dir reports
      - name: Upload machine-readable feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feasibility-${{ matrix.os }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
