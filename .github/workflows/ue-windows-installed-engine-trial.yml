name: UE5.8 Windows Android installed engine trial

# Authorized UE source and downloaded dependencies live only on temporary runner.
# No private Epic engine artifacts, code, cache, or credential logs are uploaded.
on:
  push:
    branches: [main]
    paths: [.github/workflows/ue-windows-installed-engine-trial.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sceneforge-ue58-windows-android-build
  cancel-in-progress: false

jobs:
  windows-deps:
    runs-on: windows-2025
    timeout-minutes: 355
    steps:
      - name: Set up Java 21 for Unreal Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compatible .NET SDKs for Unreal build tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
      - name: Set up Android SDK CLI
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Pin Android SDK 35, build-tools 35.0.1 and NDK r27c
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.1' 'ndk;27.2.12479018'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned Android SDK/NDK tools.' }
          if (-not (Test-Path (Join-Path $env:ANDROID_HOME 'ndk/27.2.12479018'))) { throw 'Android NDK r27c is unavailable.' }
          "NDKROOT=$(Join-Path $env:ANDROID_HOME 'ndk/27.2.12479018')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bounded UE5.8 Android-enabled installed engine BuildGraph trial
        shell: pwsh
        env:
          EPIC_SOURCE_TOKEN: ${{ secrets.EPIC_SOURCE_TOKEN }}
          EPIC_SOURCE_CLASSIC_TOKEN: ${{ secrets.EPIC_SOURCE_CLASSIC_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/EpicGames/UnrealEngine'
          function Test-SourceAccess([string]$token) {
            if ([string]::IsNullOrEmpty($token)) { return $false }
            try {
              $r = Invoke-WebRequest -Uri $api -Headers @{
                Authorization = "Bearer $token"
                Accept = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              } -Method Get -TimeoutSec 25 -UseBasicParsing
              return $r.StatusCode -eq 200
            }
            catch { return $false }
          }
          $tokenType = ''
          if (Test-SourceAccess $env:EPIC_SOURCE_TOKEN) {
            $env:UE_GIT_SOURCE_TOKEN = $env:EPIC_SOURCE_TOKEN
            $tokenType = 'fine-grained'
          }
          elseif (Test-SourceAccess $env:EPIC_SOURCE_CLASSIC_TOKEN) {
            $env:UE_GIT_SOURCE_TOKEN = $env:EPIC_SOURCE_CLASSIC_TOKEN
            $tokenType = 'temporary-classic'
          }
          else { throw 'No token authorized for Epic private Unreal source.' }
          # The GitHub runner's temp/workspace is commonly on D:, while C:
          # only has ~31 GiB. Check the ACTUAL source-checkout volume.
          $checkoutDrive = ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)).TrimEnd('\').TrimEnd(':')
          function FreeGiB() {
            [math]::Round((Get-PSDrive -Name $checkoutDrive).Free / 1GB, 2)
          }
          $before = FreeGiB
          Write-Output "Runner temp drive: $checkoutDrive; free: $before GiB."
          if ($before -lt 105) { throw "Insufficient disk headroom on checkout drive for safe Windows dependency test: $before GiB." }
          $folder = Join-Path $env:RUNNER_TEMP 'ue58-windows-dependencies'
          $askpass = Join-Path $env:RUNNER_TEMP 'ue58-askpass.cmd'
          $out = Join-Path $env:RUNNER_TEMP 'ue58-setup-private-stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'ue58-setup-private-stderr.log'
          @'
          @echo off
          echo %~1 | findstr /I "Username" >nul
          if not errorlevel 1 (
            echo x-access-token
          ) else (
            echo %UE_GIT_SOURCE_TOKEN%
          )
          '@ | Set-Content -Path $askpass -Encoding ascii
          $env:GIT_ASKPASS = $askpass
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GCM_INTERACTIVE = 'Never'
          $start = Get-Date
          try {
            Write-Output 'Checking out licensed UE 5.8 source; private Git output suppressed.'
            & git -c credential.helper= clone --quiet --depth 1 --filter=blob:none --single-branch --branch 5.8 https://github.com/EpicGames/UnrealEngine.git $folder 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Private git clone failed with status $LASTEXITCODE." }
            Remove-Item $askpass -Force -ErrorAction SilentlyContinue
            Remove-Item Env:UE_GIT_SOURCE_TOKEN -ErrorAction SilentlyContinue
            if (-not (Test-Path (Join-Path $folder 'Setup.bat'))) { throw 'Unreal Setup.bat missing after authorized checkout.' }
            $checkoutFree = FreeGiB
            if ($checkoutFree -lt 90) { throw "Insufficient free space after clone: $checkoutFree GiB." }
            # UE5.8 Setup.bat can display an interactive UnrealVersionSelector file-type
            # registration prompt on headless runners. Apply Epic's forum-recommended
            # /register /unattended adjustment ONLY to ephemeral licensed checkout.
            $setupBat = Join-Path $folder 'Setup.bat'
            $setupText = [System.IO.File]::ReadAllText($setupBat)
            $selectorPattern = '(?i)(UnrealVersionSelector-Win64-Shipping\.exe\s+/register)(?!\s+/unattended)'
            if ([regex]::IsMatch($setupText, $selectorPattern)) {
              $patchedSetup = [regex]::Replace($setupText, $selectorPattern, '$1 /unattended')
              [System.IO.File]::WriteAllText($setupBat, $patchedSetup)
              Write-Output 'Made local UnrealVersionSelector registration unattended; no Epic script content published.'
            }
            else {
              Write-Output 'No interactive UnrealVersionSelector registration match found in this source checkout.'
            }
            Write-Output 'Running bounded Unreal Setup.bat for Windows + Android. Other platforms excluded.'
            # Preserve Android support. Avoid downloading other host/console platforms.
            # Keep iOS/tvOS Setup dependencies even when their engine targets are disabled.
            # AutomationTool still compiles platform helpers that reference those resources.
            $excludes = '-exclude=Mac -exclude=MacOS -exclude=Linux -exclude=LinuxArm64 -exclude=Win32'
            $command = "Setup.bat --force $excludes"
            $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d', '/s', '/c', $command -WorkingDirectory $folder -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
            $stopped = 'no'
            $stopReason = ''
            $deadline = (Get-Date).AddMinutes(65)
            while (-not $p.HasExited) {
              Start-Sleep -Seconds 15
              $p.Refresh()
              if ((FreeGiB) -lt 32) {
                $stopped = 'yes'
                $stopReason = 'disk-below-32-GiB'
                break
              }
              if ((Get-Date) -gt $deadline) {
                $stopped = 'yes'
                $stopReason = 'dependency-time-budget'
                break
              }
            }
            if ($stopped -eq 'yes' -and -not $p.HasExited) {
              & taskkill.exe /F /T /PID $p.Id 2>$null | Out-Null
              $p.WaitForExit(20000) | Out-Null
            }
            $p.Refresh()
            $rc = if ($stopped -eq 'yes') { 99 } else { $p.ExitCode }
            $after = FreeGiB
            $measured = [math]::Round($before - $after, 2)
            $summary = @(
              '### UE 5.8 Windows+Android source dependency footprint',
              "- Source credential: $tokenType",
              "- Starting free disk (GiB): $before",
              "- Free disk after source checkout (GiB): $checkoutFree",
              "- Free disk after Setup (GiB): $after",
              "- Disk consumed total (GiB): $measured",
              "- Setup exit code: $rc",
              "- Safety cutoff reached: $stopped",
              "- Cutoff reason: $stopReason",
              '- Android dependency exclusions: NONE',
              '- Engine compilation: follows successful dependency setup only',
              '- APK generated: NO (installed-engine compilation test)',
              '- Epic private source or dependency files uploaded: NO'
            )
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine)
            $summary | ForEach-Object { Write-Output $_ }
            if ($rc -ne 0) { throw 'Dependency setup incomplete; compile not attempted.' }
            $iosResource = Join-Path $folder 'Engine/Source/Programs/AutomationTool/IOS/Resources/GreenCheck.png'
            $hasIosResource = Test-Path -LiteralPath $iosResource
            Write-Output "AutomationTool iOS shared resource present: $hasIosResource"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- AutomationTool iOS shared resource present: $hasIosResource"
            if ((FreeGiB) -lt 45) { throw 'Insufficient post-Setup disk headroom for compilation.' }
            Write-Output 'Dependencies completed. Starting Android-enabled Unreal installed-engine BuildGraph.'
            Write-Output 'Installed .NET SDK major versions:'
            $sdkVersions = & dotnet --list-sdks 2>$null | ForEach-Object {
              if ($_ -match '^(\d+)\.(\d+)\.') { "$($Matches[1]).$($Matches[2])" }
            } | Select-Object -Unique
            if ($sdkVersions) { Write-Output ($sdkVersions -join ', ') }
            $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio/Installer/vswhere.exe'
            if (Test-Path $vswhere) {
              $vsInfos = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
              Write-Output "MSVC-capable Visual Studio versions: $($vsInfos -join ', ')"
            }
            $config = Join-Path $folder 'Engine/Saved/UnrealBuildTool/BuildConfiguration.xml'
            New-Item -ItemType Directory -Force -Path (Split-Path $config) | Out-Null
            $xml = '<Configuration xmlns="https://www.unrealengine.com/BuildConfiguration"><BuildConfiguration><MaxParallelActions>2</MaxParallelActions></BuildConfiguration><ParallelExecutor><MemoryPerActionBytes>4294967296</MemoryPerActionBytes></ParallelExecutor></Configuration>'
            Set-Content -Path $config -Value $xml -Encoding utf8
            # On NTFS, newly generated object files and installed-build copies inherit
            # directory compression. This can buy disk headroom on small free runners.
            # Compression is best-effort; never block if runner volume disallows it.
            $compressionTargets = @(
              (Join-Path $folder 'Engine/Intermediate'),
              (Join-Path $folder 'LocalBuilds')
            )
            foreach ($target in $compressionTargets) {
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              $compressionOutput = & compact.exe /C /I /Q "/S:$target" 2>$null
              $compRc = $LASTEXITCODE
              Write-Output "NTFS compression for generated files: $([System.IO.Path]::GetFileName($target)); exit: $compRc"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- NTFS output compression $([System.IO.Path]::GetFileName($target)): exit $compRc"
            }
            Write-Output 'BuildGraph target: Win64 editor and Android, Development game configuration only.'
            $buildOut = Join-Path $env:RUNNER_TEMP 'ue58-build-private-stdout.log'
            $buildErr = Join-Path $env:RUNNER_TEMP 'ue58-build-private-stderr.log'
            # Retain Android; build Development only instead of the default three game configurations.
            # Epic documents GameConfigurations as a supported InstalledEngineBuild.xml setting.
            $args = 'BuildGraph -Script=Engine/Build/InstalledEngineBuild.xml -Target="Make Installed Build Win64" -set:WithWin64=true -set:WithWin32=false -set:WithAndroid=true -set:WithDDC=false -set:WithLinux=false -set:WithLinuxArm64=false -set:WithMac=false -set:WithIOS=false -set:WithTVOS=false -set:WithFullDebugInfo=false -set:WithClient=false -set:WithServer=false -set:GameConfigurations=Development -NoP4 -unattended'
            $uat = Join-Path $folder 'Engine/Build/BatchFiles/RunUAT.bat'
            $build = Start-Process -FilePath $uat -ArgumentList $args -WorkingDirectory $folder -RedirectStandardOutput $buildOut -RedirectStandardError $buildErr -PassThru -WindowStyle Hidden
            $buildDeadline = (Get-Date).AddMinutes(315)
            $buildStop = 'none'
            while (-not $build.HasExited) {
              Start-Sleep -Seconds 20
              $build.Refresh()
              if ((FreeGiB) -lt 20) { $buildStop = 'disk-safety-limit'; break }
              if ((Get-Date) -gt $buildDeadline) { $buildStop = 'build-time-limit'; break }
            }
            if ($buildStop -ne 'none' -and -not $build.HasExited) {
              & taskkill.exe /F /T /PID $build.Id 2>$null | Out-Null
              $build.WaitForExit(20000) | Out-Null
            }
            $build.Refresh()
            $buildCode = if ($buildStop -ne 'none') { 98 } else { $build.ExitCode }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Android BuildGraph exit code: $buildCode; stop reason: $buildStop; remaining GiB: $(FreeGiB)"
            Write-Output "BuildGraph exit code: $buildCode; stop reason: $buildStop; free disk GiB: $(FreeGiB)."
            # Only emit allowlisted error categories. Never reveal arbitrary
            # Engine logs, source fragments, filesystem paths, or file contents.
            $buildLogPaths = @($buildOut,$buildErr) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            if ($buildLogPaths.Count -gt 0) {
              $privateLog = ($buildLogPaths | ForEach-Object { [System.IO.File]::ReadAllText($_) }) -join [Environment]::NewLine
              $diagnosticPatterns = [ordered]@{
                'Unknown BuildGraph target or option' = '(?im)(unknown target|target .* not found|unknown option|option .* not found|invalid argument|Unrecognized argument)'
                'AutomationTool or UBT compilation error' = '(?im)(AutomationTool.*(failed|error)|UnrealBuildTool.*(failed|error)|error CS[0-9]{4}|error MSB[0-9]{4}|error NU[0-9]{4})'
                'Dotnet runtime or SDK missing' = '(?im)(dotnet.*not found|\.NET SDK.*not found|No .NET SDKs were found|dotnet.*error)'
                'Visual Studio or MSVC toolchain unavailable' = '(?im)(Visual Studio.*not found|Visual Studio.*missing|MSVC.*not found|MSVC.*missing|No supported.*compiler|Unable to find valid.*compiler|vcvars.*not found)'
                'Windows SDK unavailable' = '(?im)(Windows SDK.*not found|Windows SDK.*missing|Windows SDK.*is required)'
                'Android SDK or NDK unavailable' = '(?im)(Android SDK.*(not found|missing|invalid)|Android NDK.*(not found|missing|invalid)|NDKROOT.*(not found|missing|invalid))'
                'Memory exhaustion' = '(?im)(out of memory|not enough memory|fatal error C1060|fatal error C1076|System.OutOfMemoryException)'
                'Disk exhaustion' = '(?im)(no space left on device|not enough space on the disk|disk full)'
                'Engine C++ compiler failure' = '(?im)(fatal error C[0-9]{4}|error C[0-9]{4}|error:.*failed to compile)'
                'Access denied or missing file' = '(?im)(Access is denied|UnauthorizedAccessException|FileNotFoundException|The system cannot find the file specified)'
                'BuildGraph node failure' = '(?im)(BUILD FAILED|BUILD FAILED:|BuildGraph.*failed|Failed to execute build graph|Node .* failed)'
              }
              $matched = @()
              foreach ($category in $diagnosticPatterns.Keys) {
                if ([regex]::IsMatch($privateLog,$diagnosticPatterns[$category])) { $matched += $category }
              }
              if ($matched.Count -eq 0) { $matched = @('Unclassified BuildGraph failure — needs targeted diagnostics') }
              Write-Output "BuildGraph diagnostic categories (safe, nonproprietary): $($matched -join ', ')."
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- BuildGraph error categories: $($matched -join ', ')"
              $codes = [regex]::Matches($privateLog, '(?i)\b(CS\d{4}|MSB\d{4}|NETSDK\d{4}|NU\d{4}|C\d{4}|LNK\d{4})\b') |
                ForEach-Object { $_.Value.ToUpperInvariant() } | Select-Object -Unique
              $codesList = if ($codes) { $codes -join ', ' } else { 'none visible' }
              Write-Output "Sanitized compiler diagnostic codes: $codesList"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Compiler diagnostic codes: $codesList"
              $targeted = [ordered]@{
                'Requires newer dotnet SDK' = '(?i)(NETSDK1045|NETSDK1047|The current .NET SDK does not support targeting|requires a higher version of .NET)'
                'Missing dotnet target packs' = '(?i)(NETSDK1127|NETSDK1112|NETSDK1005|Unable to find package Microsoft.NETCore.App.Ref)'
                'CSharp symbols missing' = '(?i)(CS0246|CS0234|CS0103|CS0117|CS1061)'
                'NuGet package restoration failed' = '(?i)(NU1101|NU1102|NU1301|Failed to restore|Unable to load the service index)'
                'Invalid BuildGraph arguments' = '(?i)(Unrecognized argument|Unrecognized option|Unknown option|Unknown target|No target with name)'
                'Visual Studio components' = '(?i)(MSB8020|MSB8036|MSB8041|MSB8044|MSB8066|MSB3073)'
              }
              foreach ($key in $targeted.Keys) {
                if ([regex]::IsMatch($privateLog, $targeted[$key])) {
                  Write-Output "Targeted diagnostic: $key"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Targeted diagnostic: $key"
                }
              }
              # Report narrowly scoped MSBuild failure evidence without exposing Epic paths or source.
              $msbuildSignals = [ordered]@{
                'MSB3245 unresolved assembly reference' = '(?i)\bMSB3245\b'
                'MSB3243 conflicting assembly references' = '(?i)\bMSB3243\b'
                'MSB3554 resource generation failure' = '(?i)\bMSB3554\b'
                'MSB4019 imported project not found' = '(?i)\bMSB4019\b'
                'MSB4236 SDK resolver failure' = '(?i)\bMSB4236\b'
                'MSB3073 command execution failure' = '(?i)\bMSB3073\b'
              }
              foreach ($signal in $msbuildSignals.Keys) {
                $signalCount = ([regex]::Matches($privateLog, $msbuildSignals[$signal])).Count
                if ($signalCount -gt 0) {
                  Write-Output "Sanitized MSBuild signal: $signal (occurrences: $signalCount)."
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Sanitized MSBuild signal: $signal (occurrences: $signalCount)"
                }
              }
              $failurePhase = if ($privateLog -match '(?i)\bMSB3554\b') { 'MSBuild resource generation' } elseif ($privateLog -match '(?i)\bMSB3245\b') { 'MSBuild assembly resolution' } else { 'BuildGraph or AutomationTool (unspecified)' }
              $iosMissingEvidence = [regex]::IsMatch($privateLog, '(?i)(GreenCheck\.png|IOS\.Automation\.Properties\.Resources\.resources|IOS[\\/]Resources)')
              Write-Output "AutomationTool iOS resource referenced in failure log: $iosMissingEvidence"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- AutomationTool iOS resource referenced in failure log: $iosMissingEvidence"
              Write-Output "Sanitized probable failure phase: $failurePhase"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Probable failure phase: $failurePhase"
              $errorLines = ([regex]::Matches($privateLog, 'ERROR:|error CS[0-9]{4}|error MSB[0-9]{4}|Exception:', 'IgnoreCase')).Count
              Write-Output "BuildGraph error-marker line count: $errorLines."
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- BuildGraph error-marker line count: $errorLines"
              Remove-Variable privateLog -ErrorAction SilentlyContinue
            }
            if ($buildCode -ne 0) { throw 'Bounded Android-enabled Unreal BuildGraph failed. Diagnostic categories provided above; no engine files uploaded.' }
            Write-Output 'Android-enabled installed-engine BuildGraph returned success. No engine artifacts uploaded.'
          }
          finally {
            Remove-Item Env:UE_GIT_SOURCE_TOKEN -ErrorAction SilentlyContinue
            $cleanupFiles = @($askpass,$out,$err,$buildOut,$buildErr) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            if ($cleanupFiles.Count -gt 0) { Remove-Item -LiteralPath $cleanupFiles -Force -ErrorAction SilentlyContinue }
            if (Test-Path $folder) { Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue }
          }
