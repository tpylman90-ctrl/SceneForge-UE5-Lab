name: Epic source access feasibility

# Source access probe only; no Unreal source is downloaded, uploaded, or logged.
# Public project code is permitted; private Unreal source never enters this repository.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/epic-source-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  epic-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check existing Epic-linked token for UE source access
        shell: bash
        env:
          EPIC_SOURCE_TOKEN: ${{ secrets.EPIC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          # Require the dedicated least-privilege token: no package-token fallback.
          if [ -z "${EPIC_SOURCE_TOKEN:-}" ]; then
            echo "::error::EPIC_SOURCE_TOKEN is missing from repository Actions secrets."
            printf '%s\n' '### Epic source access: missing dedicated token' >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          # Only HTTP status: neither token nor response contents are displayed.
          http_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $EPIC_SOURCE_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/EpicGames/UnrealEngine)
          case "$http_code" in
            200)
              echo "Dedicated Epic source token can read the UnrealEngine repository."
              printf '%s\n' '### Epic source access: verified HTTP 200' 'Source checkout access verified. Android engine compilation remains untested.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            401|403|404)
              echo "Configured token cannot read Epic's private UnrealEngine source repository (HTTP $http_code)."
              printf '%s\n' "### Epic source access: HTTP $http_code" 'Not authorized; workflow is intentionally red until access is verified.' >> "$GITHUB_STEP_SUMMARY"
              exit 4
              ;;
            *)
              echo "Epic source repository API returned HTTP $http_code; indeterminate."
              printf '%s\n' "### Epic source access: HTTP $http_code" 'Indeterminate; source access is not confirmed.' >> "$GITHUB_STEP_SUMMARY"
              exit 5
              ;;
          esac
