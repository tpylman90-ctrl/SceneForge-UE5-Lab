name: Official Epic container feasibility

# Membership accepted in EpicGames; recheck GHCR access after organization processing.
# Official Epic development image is license/credential gated. NEVER log tokens
# or upload the proprietary engine as an artifact.
on:
  # Build test is triggered only when this trusted main-branch workflow changes.
  # No PR events or untrusted code use the registry PAT.
  push:
    branches: [main]
    paths:
      - .github/workflows/hosted-container.yml
  workflow_dispatch:
    inputs:
      stage:
        description: 'Probe official UE 5.8 container on hosted Ubuntu'
        type: choice
        required: true
        default: manifest
        options:
          - manifest
          - pull
          - android

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0
      GHCR_USER: ${{ github.repository_owner }}
      UE_IMAGE_TAG: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project validation
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Baseline runner report
        run: python3 scripts/ci/runner_probe.py --report-dir reports
      - name: Authenticate to Epic's GHCR development image
        env:
          EPIC_GHCR_TOKEN: ${{ secrets.EPIC_GHCR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EPIC_GHCR_TOKEN" ]; then
            echo "::error::Set Actions secret EPIC_GHCR_TOKEN to an Epic-entitled GitHub PAT with read:packages. See docs/EPIC_CONTAINER.md."
            exit 2
          fi
          printf '%s' "$EPIC_GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Test authenticated manifest availability (no engine download)
        shell: bash
        run: |
          set -euo pipefail
          # Official Epic tag verified by authenticated manifest. Record digest on pull.
          if ! docker manifest inspect "$UE_IMAGE_TAG" >/dev/null; then
            echo "::error::Epic image access denied. Confirm the EpicGames GitHub invitation was accepted and the token belongs to the Epic-linked account."
            exit 3
          fi
          echo "Official pinned image manifest was accessible." >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pull official UE installed-build container
        if: ${{ inputs.stage == 'pull' || inputs.stage == 'android' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
          docker pull "$UE_IMAGE"
          docker image inspect "$UE_IMAGE" --format 'Resolved image digest(s): {{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint /bin/bash "$UE_IMAGE" -lc '
            set -euo pipefail
            uat=/home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh
            test -f "$uat"
            cat /home/ue4/UnrealEngine/Engine/Build/Build.version
          '
          docker image inspect "$UE_IMAGE" --format 'Unpacked image size: {{.Size}} bytes'
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        if: ${{ inputs.stage == 'android' || github.event_name == 'push' }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK command-line tools
        if: ${{ inputs.stage == 'android' || github.event_name == 'push' }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain on host
        if: ${{ inputs.stage == 'android' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          test -n "${ANDROID_HOME:-}"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.1' 'ndk;27.2.12479018'
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          grep -E '^Pkg.Revision[[:space:]]*=[[:space:]]*27\.2\.12479018' "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          java -version
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check free space before Unreal packaging
        if: ${{ inputs.stage == 'android' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
          free -h | tee -a "$GITHUB_STEP_SUMMARY"
          # Safe failure if less than 8GiB remain after image + Android SDK.
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$avail_kb" -lt 8388608 ]; then
            echo "::error::Insufficient disk headroom (<8GiB) for Unreal cook."
            exit 4
          fi
      - name: Cook and package Android APK inside Epic container
        if: ${{ inputs.stage == 'android' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .uehome dist
          # Epic's engine directory belongs to the image's non-root 'ue4'
          # user. Overriding it with the hosted runner UID causes EACCES
          # even when trying to stat RunUAT.sh.
          host_uid=$(id -u)
          host_gid=$(id -g)
          image_uid=$(docker run --rm --entrypoint /usr/bin/id "$UE_IMAGE" -u)
          image_gid=$(docker run --rm --entrypoint /usr/bin/id "$UE_IMAGE" -g)
          if [ "$image_uid" = 0 ]; then
            echo "::error::Official Unreal image unexpectedly defaults to root; refusing root cook."
            exit 5
          fi
          echo "Container uid/gid: $image_uid:$image_gid"
          echo "Runner uid/gid: $host_uid:$host_gid"
          # Project files must be writable by the image's ue4 user.
          sudo chown -R "$image_uid:$image_gid" "$GITHUB_WORKSPACE"
          docker run --rm \
            --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$ANDROID_HOME:/opt/android-sdk" \
            --volume "$JAVA_HOME:/opt/java:ro" \
            --workdir /workspace \
            --env HOME=/workspace/.uehome \
            --env UE_ROOT=/home/ue4/UnrealEngine \
            --env ANDROID_HOME=/opt/android-sdk \
            --env ANDROID_SDK_ROOT=/opt/android-sdk \
            --env NDKROOT=/opt/android-sdk/ndk/27.2.12479018 \
            --env JAVA_HOME=/opt/java \
            "$UE_IMAGE" -lc 'python3 scripts/ci/package_android.py --archive-dir /workspace/dist'
      - name: Restore host ownership for artifact uploader
        if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi
      - name: Upload Android APK only when created
        if: ${{ (inputs.stage == 'android' || github.event_name == 'push') && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ue5lab-hosted-android-${{ github.run_number }}
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload nonproprietary capacity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-runner-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: End registry session
        if: always()
        run: docker logout ghcr.io || true
